name: Actualizar resultados

# Baja el fixture de la URBA y el stream de YouTube y, si cambió algún resultado, commitea en main y vuelve a publicar.
on:
  schedule:
    # sábado (hora Argentina, UTC-3): cada 10 min todo el día; la madrugada del domingo en UTC cierra la noche del sábado
    # (en minutos terminados en 3 y no en :00/:30, que es cuando GitHub más demora o saltea corridas)
    - cron: "3,13,23,33,43,53 3-23 * * 6"
    - cron: "3,13,23,33,43,53 0-2 * * 0"
    # viernes y domingo: cada 2 horas, de 9 a 19 hs de Argentina
    - cron: "17 12,14,16,18,20,22 * * 5,0"
    # lunes a jueves: nada
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: run
        run: echo "res=$(python3 scripts/actualizar_resultados.py)" >> "$GITHUB_OUTPUT"
      - id: stream
        run: echo "res=$(python3 scripts/actualizar_stream.py)" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.res == 'cambios' || steps.stream.outputs.res == 'cambios'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: resultados y stream actualizados"
          git push
          # los commits hechos con el token no disparan otros workflows: se publica a mano
          gh workflow run pages.yml --ref main
